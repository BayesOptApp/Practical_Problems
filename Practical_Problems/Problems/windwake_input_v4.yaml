# FLORIS 4.7 migration of windwake_input.json.
# Original custom turbine is embedded; no separate turbine YAML is needed.
# v2 power entries are Cp, converted to kW at each original wind-speed knot.
# v4 interpolates power rather than Cp: between-knot values may differ.
# v2 gauss_legacy -> v4 gauss; this is not a bitwise-equivalent simulator.
# v2 ngrid=5 -> v4 turbine_grid_points=3 (v4 rejects values above 3).
# Yaw and tilt remain zero. Minimum turbine spacing in the wrapper is 252 m.
name: windwake_v2_migrated
description: Migration of supplied FLORIS v2 input. gauss is the v4 counterpart of
  gauss_legacy; numerical equivalence is not guaranteed.
floris_version: v4
logging:
  console:
    enable: true
    level: WARNING
  file:
    enable: false
    level: WARNING
solver:
  type: turbine_grid
  turbine_grid_points: 3
